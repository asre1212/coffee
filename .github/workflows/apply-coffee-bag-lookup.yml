name: Apply Coffee Bag Lookup Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-coffee-bag-lookup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch
        run: |
          set -euo pipefail
          : > /tmp/coffee.patch.b64
          for part in part-00 part-01 part-02 part-03 part-04 part-05a part-05b part-06; do
            cat ".codex/coffee-bag-lookup-patch/${part}.b64" >> /tmp/coffee.patch.b64
          done
          actual="$(sha256sum /tmp/coffee.patch.b64 | awk '{print $1}')"
          expected="15756aa74be13e4de8160e5fdba902bf4246b9bfae4233406c5404e44d3eab52"
          test "$actual" = "$expected"
          base64 --decode /tmp/coffee.patch.b64 > /tmp/coffee.patch
          git apply --index --whitespace=nowarn /tmp/coffee.patch
          rm -rf .codex/coffee-bag-lookup-patch
          rm -f .github/workflows/apply-coffee-bag-lookup.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add coffee bag photo lookup"
          git push
